[package]
name = "misaki-rs"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "A self-contained, POS-aware Grapheme-to-Phoneme (G2P) engine for Rust, optimized for TTS models like Kokoro."
homepage = "https://github.com/elana-voss/misaki-rs"
repository = "https://github.com/elana-voss/misaki-rs"
readme = "README.md"
exclude = ["espeak-rs-sys"]

[features]
default = ["espeak"]
espeak = ["dep:espeak-rs", "dep:espeak-rs-sys"]

[dependencies]
log = "0.4"
regex = "1.10"
num2words = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fancy-regex = "0.13"
language-tokenizer = { version = "0.1", features = ["snowball"] }
espeak-rs = { version = "0.1.9", optional = true }
espeak-rs-sys = { version = "0.1.9", optional = true }
thiserror = "2.0"

[dev-dependencies]
env_logger = "0.11"

[[example]]
name = "test_stress_fix"
required-features = ["espeak"]

# espeak-rs-sys 0.1.9 with its two fixes for Windows MSVC; a project using this crate patches it the same way
[patch.crates-io]
espeak-rs-sys = { path = "espeak-rs-sys" }
